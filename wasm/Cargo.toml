[package]
name = "anchor-wasm"
version = "0.1.0"
edition = "2024"

# The WebAssembly boundary (ADR-0009 §1-2): the only crate with `unsafe`, and no logic of its own.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anchor-core = { path = "../core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 3
